name: Keep Alive

on:
  schedule:
    # 每天 UTC 12:00 触发（北京时间 20:00）
    - cron: '0 12 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep repo alive
        run: echo "✅ Repository keepalive heartbeat - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
